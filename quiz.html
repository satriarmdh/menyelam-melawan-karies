<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kuis Petualangan AR - Marker 8</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="./js/shaders.js?v=20261014"></script>

    <link rel="stylesheet" href="./style.css">
    <style>
        /* Quiz Specific Styling */
        :root {
            --quiz-cyan: #00e5ff;
            --quiz-green: #4caf50;
            --quiz-red: #ff5252;
            --quiz-dark: #0a192f;
        }

        /* Top Bar Layout */
        .quiz-top-bar {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1200;
            pointer-events: none;
        }

        .quiz-top-bar>* {
            pointer-events: auto;
        }

        .quiz-top-bar .back-button {
            position: static;
            width: auto;
            height: auto;
            padding: 8px 16px;
            background: linear-gradient(180deg, #ffffff 0%, #def6fb 40%, #b2ebf6 82%, #8cdbef 100%);
            border: 2px solid #ffffff;
            border-radius: 999px;
            color: #205882;
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(2, 32, 60, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .quiz-top-bar .back-button:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
            color: #124063;
        }

        .quiz-top-bar .back-button:active {
            transform: scale(0.95);
        }

        /* Quiz Navigation Pills */
        .quiz-nav-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(4, 14, 28, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .quiz-nav-label {
            font-size: 12px;
            font-weight: 800;
            color: #94a3b8;
            margin-right: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quiz-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quiz-pill:hover {
            background: rgba(0, 229, 255, 0.25);
            border-color: #00e5ff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .quiz-pill.active {
            background: linear-gradient(135deg, #00e5ff 0%, #00838f 100%);
            color: #051326;
            font-weight: 900;
            border-color: #ffffff;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.7);
            transform: scale(1.08);
        }

        /* Marker 8 Badge */
        .marker-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #e0f7fa;
            padding: 9px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 720px) {
            .quiz-top-bar {
                top: 14px;
                padding: 0 12px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .quiz-nav-container {
                order: 3;
                margin: 6px auto 0;
                padding: 4px 10px;
            }

            .quiz-pill {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .quiz-nav-label {
                display: none;
            }

            .marker-badge {
                padding: 7px 12px;
                font-size: 12px;
            }
        }

        /* Result Popup Modal */
        .result-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(4, 14, 28, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-modal.active {
            display: flex;
            animation: modalPop 0.35s ease-out forwards;
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-card {
            background: linear-gradient(160deg, #102a45 0%, #0a1b2e 100%);
            border-radius: 28px;
            border: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 229, 255, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 32px 28px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: #ffffff;
        }

        .result-card.card-correct {
            border-color: rgba(76, 175, 80, 0.85);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(76, 175, 80, 0.4);
        }

        .result-card.card-wrong {
            border-color: rgba(255, 82, 82, 0.85);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 82, 82, 0.4);
        }

        .result-icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .result-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .result-desc {
            font-size: 16px;
            line-height: 1.5;
            color: #d1e8ff;
            margin: 0;
            max-width: 380px;
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 12px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s ease;
        }

        .btn-action.btn-next {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.35);
        }

        .btn-action.btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
        }

        .btn-action.btn-replay {
            background: linear-gradient(135deg, #00e5ff 0%, #00838f 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
        }

        .btn-action.btn-replay:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
        }

        .btn-action.btn-chapter {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-action.btn-chapter:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-action.btn-home {
            background: transparent;
            color: #90caf9;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-action.btn-home:hover {
            color: #ffffff;
        }
    </style>

    <script>
        // Inisialisasi awal ID Kuis dari URL parameter (?quiz=1..5 atau ?quiz=score)
        const __params = new URLSearchParams(window.location.search);
        const __rawParam = (__params.get('quiz') || __params.get('id') || '1').toLowerCase();
        let __initialQuizId;
        if (__rawParam === 'score' || __rawParam === 'final' || __rawParam === '6') {
            __initialQuizId = 'score';
            document.title = `Kuis Petualangan AR - Skor Akhir (Marker 8)`;
        } else {
            __initialQuizId = parseInt(__rawParam, 10);
            if (isNaN(__initialQuizId) || __initialQuizId < 1 || __initialQuizId > 5) __initialQuizId = 1;
            document.title = `Kuis Petualangan AR - Babak ${__initialQuizId} (Marker 8)`;
        }
        window.__CURRENT_QUIZ_ID__ = __initialQuizId;

        // Register A-Frame Component for Reliable 3D Next Button Clicking
        if (typeof AFRAME !== 'undefined') {
            AFRAME.registerComponent('quiz-next-trigger', {
                init: function () {
                    const el = this.el;
                    const triggerNext = (evt) => {
                        if (evt) {
                            evt.stopPropagation();
                        }
                        console.log('🎯 [A-Frame Component] quiz-next-trigger berhasil diklik pada Marker 8!');
                        if (window.__triggerNextQuiz) {
                            window.__triggerNextQuiz();
                        }
                    };
                    el.addEventListener('click', triggerNext);
                    el.addEventListener('touchend', triggerNext);
                    el.addEventListener('mousedown', triggerNext);
                }
            });

            AFRAME.registerComponent('quiz-choice-left', {
                init: function () {
                    const el = this.el;
                    const triggerLeft = (evt) => {
                        if (evt) evt.stopPropagation();
                        console.log('🎯 [A-Frame Component] quiz-choice-left berhasil diklik pada Marker 8!');
                        if (window.__triggerQuizChoiceLeft) {
                            window.__triggerQuizChoiceLeft();
                        }
                    };
                    el.addEventListener('click', triggerLeft);
                    el.addEventListener('touchend', triggerLeft);
                    el.addEventListener('mousedown', triggerLeft);
                }
            });

            AFRAME.registerComponent('quiz-choice-right', {
                init: function () {
                    const el = this.el;
                    const triggerRight = (evt) => {
                        if (evt) evt.stopPropagation();
                        console.log('🎯 [A-Frame Component] quiz-choice-right berhasil diklik pada Marker 8!');
                        if (window.__triggerQuizChoiceRight) {
                            window.__triggerQuizChoiceRight();
                        }
                    };
                    el.addEventListener('click', triggerRight);
                    el.addEventListener('touchend', triggerRight);
                    el.addEventListener('mousedown', triggerRight);
                }
            });
        }
    </script>
</head>

<body>
    <!-- Top Navigation Bar -->
    <div class="quiz-top-bar">
        <!-- Back to Chapter 1 -->
        <a href="chapter1.html" class="back-button">Bab 1</a>

        <!-- Quiz Selector Pills (1 - 5 + Final Score) -->
        <div class="quiz-nav-container" id="quizNavContainer">
            <span class="quiz-nav-label">Kuis:</span>
            <button type="button" class="quiz-pill" data-quiz="1">1</button>
            <button type="button" class="quiz-pill" data-quiz="2">2</button>
            <button type="button" class="quiz-pill" data-quiz="3">3</button>
            <button type="button" class="quiz-pill" data-quiz="4">4</button>
            <button type="button" class="quiz-pill" data-quiz="5">5</button>
            <button type="button" class="quiz-pill" data-quiz="score" title="Skor Akhir">Skor</button>
        </div>

        <!-- Marker 8 Badge -->
        <div class="marker-badge">
            <span>Target: Marker 8</span>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <!-- Loading Spinner Rings -->
            <div class="loading-visual">
                <div class="loading-ring outer-ring"></div>
                <div class="loading-ring inner-ring"></div>
            </div>

            <!-- AR Title -->
            <h1 class="loading-title" id="loadingTitle">Kuis Bawah Laut</h1>

            <!-- Loading Progress Bar -->
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
            <div class="loading-progress" id="loadingProgress">0%</div>

            <!-- Start Button -->
            <button class="start-button" id="startButton" disabled>Mulai</button>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar" style="display: none !important; visibility: hidden !important;">Arahkan
        kamera ke Marker 8...</div>

    <!-- Result Popup Modal (Fallback) -->
    <div class="result-modal" id="resultModal">
        <div class="result-card" id="resultCard">
            <div class="result-icon" id="resultIcon">🎉</div>
            <h2 class="result-title" id="resultTitle">Hebat Sekali!</h2>
            <p class="result-desc" id="resultDesc">
                Jawabanmu benar!
            </p>
            <div class="result-actions">
                <button class="btn-action btn-next" id="btnNextQuiz" style="display: none;">
                    ➡️ Lanjut ke Kuis Selanjutnya
                </button>
                <button class="btn-action btn-replay" id="btnReplayQuiz">
                    🔄 Ulangi Kuis
                </button>
                <a href="./chapter2.html" class="btn-action btn-chapter">
                    📖 Kembali ke Cerita (Bab 2)
                </a>
                <a href="./index.html" class="btn-action btn-home">
                    🏠 Halaman Utama
                </a>
            </div>
        </div>
    </div>

    <!-- AR Scene Tracking Marker 8 (targetIndex: 7) -->
    <a-scene id="arScene" mindar-image="
            imageTargetSrc: ./targets-mind/targets-chapter2.mind;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
            warmupTolerance: 3;
            missTolerance: 5;
            maxTrack: 1;
            uiLoading: no;
            uiError: no;
        " color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: false, antialias: false, precision: mediump, powerPreference: high-performance"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse"
            raycaster="objects: .clickable"></a-camera>

        <!-- Target Index 7 corresponds to Marker 8 in Chapter 2 targets -->
        <a-entity id="targetQuiz" mindar-image-target="targetIndex: 7">
            <!-- 3D Quiz Scene Wrapper with Slide In & Out Animations -->
            <a-entity id="quiz-scene-wrapper" position="0 0 0" scale="1 1 1" visible="false"
                animation__slideout="property: position; to: -1.4 0 0; dur: 380; easing: easeInCubic; startEvents: trigger-slide-out"
                animation__fadeout="property: scale; to: 0.7 0.7 0.7; dur: 380; easing: easeInCubic; startEvents: trigger-slide-out"
                animation__slidein="property: position; from: 1.4 0 0; to: 0 0 0; dur: 520; easing: easeOutBack; startEvents: trigger-slide-in"
                animation__fadein="property: scale; from: 0.7 0.7 0.7; to: 1 1 1; dur: 520; easing: easeOutBack; startEvents: trigger-slide-in">

                <!-- Quiz 1 Entity Group -->
                <a-entity id="quiz-group-1" visible="false">
                    <a-image id="quiz-pertanyaan-1" src="#img-quiz-pertanyaan-1" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-1-benar" src="#vid-quiz1-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz1-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-1-salah" src="#vid-quiz1-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-advanced; src: #vid-quiz1-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Quiz 2 Entity Group -->
                <a-entity id="quiz-group-2" visible="false">
                    <a-image id="quiz-pertanyaan-2" src="#img-quiz-pertanyaan-2" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-2-benar" src="#vid-quiz2-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz2-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-2-salah" src="#vid-quiz2-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-advanced; src: #vid-quiz2-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Quiz 3 Entity Group (Keduanya berlatar magenta) -->
                <a-entity id="quiz-group-3" visible="false">
                    <a-image id="quiz-pertanyaan-3" src="#img-quiz-pertanyaan-3" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-3-benar" src="#vid-quiz3-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz3-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-3-salah" src="#vid-quiz3-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz3-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Quiz 4 Entity Group -->
                <a-entity id="quiz-group-4" visible="false">
                    <a-image id="quiz-pertanyaan-4" src="#img-quiz-pertanyaan-4" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-4-benar" src="#vid-quiz4-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz4-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-4-salah" src="#vid-quiz4-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-advanced; src: #vid-quiz4-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Quiz 5 Entity Group (Keduanya berlatar magenta) -->
                <a-entity id="quiz-group-5" visible="false">
                    <a-image id="quiz-pertanyaan-5" src="#img-quiz-pertanyaan-5" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-5-benar" src="#vid-quiz5-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz5-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-5-salah" src="#vid-quiz5-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz5-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Video Final Score: Video Skor Akhir Petualangan (Lavender/Lilac Screen #B38BDD) -->
                <a-entity id="quiz-group-score" visible="false">
                    <a-video id="video-quiz-score" src="#vid-quiz-score" position="0 0 0.15" height="1.15" width="1.15"
                        material="shader: chromakey-score; src: #vid-quiz-score; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- 3D Choice Clickable Planes (Active at 9.25s, accurately tracking Marker 8) -->
                <!-- Left card 3D plane -->
                <a-plane id="btn-choice-left-3d" class="clickable" quiz-choice-left position="-0.20 -0.012 0.22"
                    width="0.38" height="0.34"
                    material="opacity: 0.001; transparent: true; depthWrite: false; side: double"
                    visible="false"></a-plane>

                <!-- Right card 3D plane -->
                <a-plane id="btn-choice-right-3d" class="clickable" quiz-choice-right position="0.20 -0.012 0.22"
                    width="0.38" height="0.34"
                    material="opacity: 0.001; transparent: true; depthWrite: false; side: double"
                    visible="false"></a-plane>

                <!-- 3D Next Button (Muncul di bawah kartu Benar & Salah saat memilih Benar dan bergerak mengikuti Marker 8) -->
                <a-image id="btn-next-quiz-3d" class="clickable" quiz-next-trigger src="#img-quiz-next-btn"
                    position="0 -0.38 0.22" height="0.25" width="0.25"
                    material="transparent: true; opacity: 0; alphaTest: 0.01; side: double; depthWrite: false"
                    visible="false"
                    animation__fade="property: material.opacity; from: 0; to: 1; dur: 600; easing: easeOutCubic; startEvents: trigger-fade-in"
                    animation__scale="property: scale; from: 0.2 0.2 0.2; to: 1 1 1; dur: 650; easing: easeOutBack; startEvents: trigger-fade-in"
                    animation__pulse="property: scale; dir: alternate; dur: 850; easing: easeInOutSine; loop: true; to: 1.10 1.10 1; startEvents: trigger-pulse-start"></a-image>

                <!-- Transparent hit plane for 3D Next Button (High touch responsiveness) -->
                <a-plane id="btn-next-plane-3d" class="clickable" quiz-next-trigger position="0 -0.38 0.24" width="0.36"
                    height="0.32" material="opacity: 0.001; transparent: true; depthWrite: false"
                    visible="false"></a-plane>

                <!-- 3D Home Button (Menimpa mutiara pada kerang di video score.mp4 dengan posisi pas di bawah kiri) -->
                <a-image id="btn-home-score-3d" class="clickable" quiz-home-trigger src="#img-quiz-home-btn"
                    position="-0.024 -0.112 0.20" height="0.18" width="0.18"
                    material="transparent: true; opacity: 0; alphaTest: 0.01; side: double; depthWrite: false"
                    visible="false"
                    animation__fade="property: material.opacity; from: 0; to: 1; dur: 450; easing: easeOutCubic; startEvents: home-fade-in"
                    animation__scale="property: scale; from: 0.2 0.2 0.2; to: 1 1 1; dur: 550; easing: easeOutBack; startEvents: home-fade-in"
