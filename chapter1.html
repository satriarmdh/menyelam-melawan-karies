<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bagian 1</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="./js/shaders.js"></script>
    <script>
        if (typeof AFRAME !== 'undefined') {
            AFRAME.registerComponent('quiz-next-trigger', {
                init: function () {
                    const el = this.el;
                    const triggerNext = (evt) => {
                        if (evt) evt.stopPropagation();
                        console.log('🎯 [A-Frame Component] quiz-next-trigger berhasil diklik pada Marker 8!');
                        if (window.__triggerNextQuiz) window.__triggerNextQuiz();
                    };
                    el.addEventListener('click', triggerNext);
                    el.addEventListener('touchend', triggerNext);
                    el.addEventListener('mousedown', triggerNext);
                }
            });

            AFRAME.registerComponent('quiz-home-trigger', {
                init: function () {
                    const el = this.el;
                    const triggerHome = (evt) => {
                        if (evt) evt.stopPropagation();
                        console.log('🎯 [A-Frame Component] quiz-home-trigger berhasil diklik pada Marker 8!');
                        if (window.__triggerHomeFromScore) window.__triggerHomeFromScore();
                    };
                    el.addEventListener('click', triggerHome);
                    el.addEventListener('touchend', triggerHome);
                    el.addEventListener('mousedown', triggerHome);
                }
            });

            AFRAME.registerComponent('quiz-choice-left', {
                init: function () {
                    const el = this.el;
                    const triggerLeft = (evt) => {
                        if (evt) {
                            evt.stopPropagation();
                            if (evt.stopImmediatePropagation) evt.stopImmediatePropagation();
                            if (evt.preventDefault) evt.preventDefault();
                        }
                        console.log('🎯 [A-Frame Component] quiz-choice-left berhasil diklik pada Marker 8!');
                        if (window.__triggerQuizChoiceLeft) window.__triggerQuizChoiceLeft();
                    };
                    el.addEventListener('click', triggerLeft);
                    el.addEventListener('touchend', triggerLeft);
                    el.addEventListener('mousedown', triggerLeft);
                }
            });

            AFRAME.registerComponent('quiz-choice-right', {
                init: function () {
                    const el = this.el;
                    const triggerRight = (evt) => {
                        if (evt) {
                            evt.stopPropagation();
                            if (evt.stopImmediatePropagation) evt.stopImmediatePropagation();
                            if (evt.preventDefault) evt.preventDefault();
                        }
                        console.log('🎯 [A-Frame Component] quiz-choice-right berhasil diklik pada Marker 8!');
                        if (window.__triggerQuizChoiceRight) window.__triggerQuizChoiceRight();
                    };
                    el.addEventListener('click', triggerRight);
                    el.addEventListener('touchend', triggerRight);
                    el.addEventListener('mousedown', triggerRight);
                }
            });
        }
    </script>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <a href="index.html" class="home-button" id="homeButton" title="Menu Utama" aria-label="Menu Utama">
        <img src="./addon-image/navigation/home-button-crop.png" alt="Menu Utama" draggable="false" />
    </a>

    <!-- Top Navigation Bar for Quiz (Aktif saat transisi slide ke Kuis) -->
    <div class="quiz-top-bar" id="quizTopBar" style="display: none;">
        <button type="button" class="back-button" id="btnBackToChapter1">Bab 1</button>
        <div class="quiz-nav-container" id="quizNavContainer">
            <span class="quiz-nav-label">Kuis:</span>
            <button type="button" class="quiz-pill" data-quiz="1">1</button>
            <button type="button" class="quiz-pill" data-quiz="2">2</button>
            <button type="button" class="quiz-pill" data-quiz="3">3</button>
            <button type="button" class="quiz-pill" data-quiz="4">4</button>
            <button type="button" class="quiz-pill" data-quiz="5">5</button>
            <button type="button" class="quiz-pill" data-quiz="score" title="Skor Akhir">Skor</button>
        </div>
        <div class="marker-badge">
            <span>Target: Marker 8</span>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <!-- Loading Spinner Rings -->
            <div class="loading-visual">
                <div class="loading-ring outer-ring"></div>
                <div class="loading-ring inner-ring"></div>
            </div>

            <!-- AR Title -->
            <h1 class="loading-title" id="loadingTitle">Bagaimana Mencegah Karies?</h1>

            <!-- Loading Progress Bar -->
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
            <div class="loading-progress" id="loadingProgress">0%</div>

            <!-- Start Button -->
            <button class="start-button" id="startButton" disabled>Mulai</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">Mencari marker...</div>

    <div class="reset-button" id="resetButton" role="button" tabindex="0" title="Ulangi Part 1"
        aria-label="Ulangi Part 1">
        <img src="./addon-image/navigation/repeat-button-crop.png" alt="Ulangi" draggable="false" />
    </div>

    <a-scene id="arScene" mindar-image="
            imageTargetSrc: ./targets-mind/targets-chapter1.mind;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
            warmupTolerance: 3;
            missTolerance: 5;
            maxTrack: 1;
            uiLoading: no;
            uiError: no;
        " color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: false, antialias: false, precision: mediump, powerPreference: high-performance"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target1" mindar-image-target="targetIndex: 0">
            <a-entity id="video-container-part1" visible="false" scale="1.414 1.414 1" data-base-scale="1.414 1.414 1">
                <a-video id="video-laut" src="#vid-laut" position="0 0 0.10" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-laut; transparent: true; side: double"></a-video>
                <a-video id="video-kapal" src="#vid-kapal" position="0 0 0.20" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-kapal; transparent: true; side: double"></a-video>
                <a-video id="video-batu" src="#vid-batu" position="0 0 0.30" height="1" width="1"
                    material="shader: chromakey-gentle; src: #vid-batu; transparent: true; side: double"></a-video>
                <a-video id="video-gelembung" src="#vid-gelembung" position="0 0 0.35" height="1" width="1"
                    material="shader: chromakey-bubble; src: #vid-gelembung; transparent: true; side: double"></a-video>
                <a-video id="video-mascot" src="#vid-mascot" position="0 0 0.45" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-mascot; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>

        <a-entity id="target2" mindar-image-target="targetIndex: 1">
            <a-entity id="video-container-part2" visible="false" scale="1.62 1.62 1" data-base-scale="1.62 1.62 1">
                <a-video id="video-batu2" src="#vid-batu2" position="0 0 0.10" height="1" width="1"
                    material="shader: chromakey-gentle; src: #vid-batu2; transparent: true; side: double"></a-video>
                <a-video id="video-orang" src="#vid-orang" position="0 0 0.20" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-orang; transparent: true; side: double"></a-video>
                <a-video id="video-gelembung2" src="#vid-gelembung2" position="0 0 0.25" height="1" width="1"
                    material="shader: chromakey-bubble; src: #vid-gelembung2; transparent: true; side: double"></a-video>
                <a-video id="video-mascot2" src="#vid-mascot2" position="0 0 0.30" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-mascot2; transparent: true; side: double"></a-video>
                <a-video id="video-gosok" src="#vid-gosok" position="0 0 0.40" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-gosok; transparent: true; side: double"></a-video>
                <a-video id="video-text2" src="#vid-text2" position="0 0 0.45" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-text2; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>

        <a-entity id="target3" mindar-image-target="targetIndex: 2">
            <a-entity id="video-container-part3" visible="false">
                <a-video id="video-mascot3" src="#vid-mascot3" position="0 0 0.10" height="1" width="1"

                    material="shader: chromakey-advanced; src: #vid-kapal3; transparent: true; side: double"></a-video>
                <a-video id="video-sikat" src="#vid-sikat" position="0 0 0.25" height="1" width="1"

                <a-video id="video-kapal4" src="#vid-kapal4" position="0 0 0.20" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-kapal4; transparent: true; side: double"></a-video>
                <a-image id="image-lumut4" src="#img-lumut4" position="0 0 0.24" height="1" width="1"
                    material="transparent: true; alphaTest: 0.5"></a-image>
                <a-video id="video-sikat4" src="#vid-sikat4" position="0 0 0.29" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-sikat4; transparent: true; side: double"></a-video>
                <a-video id="video-teks-part4" src="#vid-teks-part4" position="0 0 0.33" height="1" width="1"
                    material="shader: chromakey-neon; src: #vid-teks-part4; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>

        <a-entity id="target5" mindar-image-target="targetIndex: 4">
            <a-entity id="video-container-part5" visible="false">
                <a-video id="video-orang5" src="#vid-orang5" position="0 0 0.20" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-orang5; transparent: true; side: double"></a-video>
                <a-video id="video-tangan" src="#vid-tangan" position="0 0 0.25" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-tangan; transparent: true; side: double"></a-video>
                <a-video id="video-teks-part5" src="#vid-teks-part5" position="0 0 0.30" height="1" width="1"
                    material="shader: chromakey-neon; src: #vid-teks-part5; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>

        <a-entity id="target6" mindar-image-target="targetIndex: 5">
            <a-entity id="video-container-part6" visible="false">
                <a-video id="video-kapal6" src="#vid-kapal6" position="0 0 0.10" height="1" width="1"
                    material="shader: blackkey-advanced; src: #vid-kapal6; transparent: true; side: double"></a-video>
                <a-video id="video-mascot2-6" src="#vid-mascot2-6" position="0 0 0.20" height="1" width="1"

        <a-entity id="target7" mindar-image-target="targetIndex: 6">

                <a-video id="video-coral7" src="#vid-coral7" position="0 0 0.20" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-coral7; transparent: true; side: double"></a-video>
                <a-video id="video-mascot7" src="#vid-mascot7" position="0 0 0.30" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-mascot7; transparent: true; side: double"></a-video>
                <a-video id="video-orang7" src="#vid-orang7" position="0 0 0.40" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-orang7; transparent: true; side: double"></a-video>
                <a-video id="video-teks-part7" src="#vid-teks-part7" position="0 0 0.45" height="1" width="1"
                    material="shader: chromakey-neon; src: #vid-teks-part7; transparent: true; side: double"></a-video>
            </a-entity>
        </a-entity>

        <!-- Part 8 & Seamless Quiz on Marker 8 -->
        <a-entity id="target8" mindar-image-target="targetIndex: 7">
            <a-entity id="video-container-part8" visible="false"
                animation__slideout="property: position; to: -1.4 0 0; dur: 380; easing: easeInCubic; startEvents: trigger-slide-out"
                animation__fadeout="property: scale; to: 0.7 0.7 0.7; dur: 380; easing: easeInCubic; startEvents: trigger-slide-out">
                <a-video id="video-air-part8-v1" src="#vid-air-part8-v1" position="0 0 0.10" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-air-part8-v1; transparent: true; side: double; depthWrite: false"></a-video>
                <a-video id="video-rumput-part8-v1" src="#vid-rumput-part8-v1" position="0 0 0.15" height="1" width="1"
                    material="shader: chromakey-magenta; src: #vid-rumput-part8-v1; transparent: true; side: double; depthWrite: false"></a-video>
                <a-video id="video-kapal-part8-v1" src="#vid-kapal-part8-v1" position="0 0 0.20" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-kapal-part8-v1; transparent: true; side: double; depthWrite: false"></a-video>
                <a-video id="video-kerang-part8-v1" class="clickable" src="#vid-kerang-part8-v1" position="0 0 0.25"
                    height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-kerang-part8-v1; transparent: true; side: double; depthWrite: false"></a-video>
                <a-video id="video-teks-quiz-part8-v1" src="#vid-teks-quiz-part8-v1" position="0 -0.030 0.28" height="1"
                    width="1" scale="0.85 0.85 1"
                    material="shader: chromakey-neon; src: #vid-teks-quiz-part8-v1; transparent: true; side: double; depthWrite: false"></a-video>

                <!-- 3D Play Button (Menimpa tombol play pada kerang di video kerang.mp4 dengan posisi pas & animasi denyut) -->
                <a-image id="btn-play-part8-3d" class="clickable" src="#img-part8-play-btn" position="0.100 -0.310 0.26"
                    height="0.105" width="0.105"
                    material="transparent: true; opacity: 0; alphaTest: 0.01; side: double; depthWrite: false"
                    visible="false"
                    animation__fade="property: material.opacity; from: 0; to: 1; dur: 300; easing: easeOutQuad; startEvents: play-fade-in"
                    animation__pulse="property: scale; from: 1 1 1; to: 1.18 1.18 1; dir: alternate; dur: 750; easing: easeInOutSine; loop: true; startEvents: play-pulse-start"></a-image>

                <!-- Transparent hit plane for 3D Play Button (Sentuhan responsif di layar) -->
                <a-plane id="btn-play-part8-plane" class="clickable" position="0.093 -0.308 0.32" width="0.22"
                    height="0.22" material="opacity: 0.001; transparent: true; depthWrite: false"
                    visible="false"></a-plane>
            </a-entity>

            <!-- 3D Quiz Scene Wrapper (Seamless Slide In Langsung di Marker 8) -->
            <a-entity id="quiz-scene-wrapper" position="1.4 0 0" scale="0.7 0.7 0.7" visible="false"
                animation__slideout="property: position; to: -1.4 0 0; dur: 380; easing: easeInCubic; startEvents: trigger-slide-out"
                animation__fadeout="property: scale; to: 0.7 0.7 0.7; dur: 380; easing: easeInCubic; startEvents: trigger-slide-out"
                animation__slidein="property: position; from: 1.4 0 0; to: 0 0 0; dur: 520; easing: easeOutBack; startEvents: trigger-slide-in"
                animation__fadein="property: scale; from: 0.7 0.7 0.7; to: 1 1 1; dur: 520; easing: easeOutBack; startEvents: trigger-slide-in">

                <!-- Quiz 1 Entity Group -->
                <a-entity id="quiz-group-1" visible="false">
                    <a-image id="quiz-pertanyaan-1" src="#img-quiz-pertanyaan-1" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-1-benar" src="#vid-quiz1-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz1-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-1-salah" src="#vid-quiz1-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-advanced; src: #vid-quiz1-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Quiz 2 Entity Group -->

                    <a-image id="quiz-pertanyaan-2" src="#img-quiz-pertanyaan-2" position="0 0 0.12" height="1"
                        width="1"

                </a-entity>

                <!-- Quiz 3 Entity Group (Keduanya berlatar magenta) -->
                <a-entity id="quiz-group-3" visible="false">
                    <a-image id="quiz-pertanyaan-3" src="#img-quiz-pertanyaan-3" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-3-benar" src="#vid-quiz3-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz3-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-3-salah" src="#vid-quiz3-salah" position="0 0 0.11" height="1" width="1"

                </a-entity>

                <!-- Quiz 4 Entity Group -->
                <a-entity id="quiz-group-4" visible="false">
                    <a-image id="quiz-pertanyaan-4" src="#img-quiz-pertanyaan-4" position="0 0 0.12" height="1"
                        width="1"
                        material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"></a-image>
                    <a-video id="video-quiz-4-benar" src="#vid-quiz4-benar" position="0 0 0.10" height="1" width="1"
                        material="shader: chromakey-magenta; src: #vid-quiz4-benar; transparent: true; side: double; depthWrite: false"></a-video>
                    <a-video id="video-quiz-4-salah" src="#vid-quiz4-salah" position="0 0 0.11" height="1" width="1"
                        material="shader: chromakey-advanced; src: #vid-quiz4-salah; transparent: true; side: double; depthWrite: false"></a-video>
                </a-entity>

                <!-- Quiz 5 Entity Group (Keduanya berlatar magenta) -->
                <a-entity id="quiz-group-5" visible="false">
                    <a-image id="quiz-pertanyaan-5" src="#img-quiz-pertanyaan-5" position="0 0 0.12" height="1"

                    <a-video id="video-quiz-score" src="#vid-quiz-score" position="0 0 0.15" height="1.15" width="1.15"

                </a-entity>

                <!-- 3D Choice Clickable Planes (Active at 9.25s, accurately tracking Marker 8) -->
                <a-plane id="btn-choice-left-3d" class="clickable" quiz-choice-left position="-0.20 -0.012 0.22"
                    width="0.38" height="0.34"
                    material="opacity: 0.001; transparent: true; depthWrite: false; side: double"
                    visible="false"></a-plane>

                <a-plane id="btn-choice-right-3d" class="clickable" quiz-choice-right position="0.20 -0.012 0.22"
                    width="0.38" height="0.34"
                    material="opacity: 0.001; transparent: true; depthWrite: false; side: double"
                    visible="false"></a-plane>

                <!-- 3D Next Button (Muncul di bawah kartu Benar & Salah saat memilih Benar dan bergerak mengikuti Marker 8) -->
                <a-image id="btn-next-quiz-3d" class="clickable" quiz-next-trigger src="#img-quiz-next-btn"
                    position="0 -0.38 0.22" height="0.25" width="0.25"
                    material="transparent: true; opacity: 0; alphaTest: 0.01; side: double; depthWrite: false"
